bt_nodes:
  - name: "Speak"
    type: "Action"
    description: "Speaks the provided text using TTS."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Text to be spoken (required). Can be a hardcoded literal (e.g. <Speak text=\"Hello!\"/>) or a blackboard reference written by a previous node (e.g. <Speak text=\"{extracted_info}\"/>). The value must be set at runtime — never use a blackboard reference that has not been written yet."
    return:
      SUCCESS: "Speaks the text provided."
      FAILURE: "The required 'text' input port is missing."

  - name: "AskYesNoQuestion"
    type: "Action"
    description: "Asks the user a yes/no question and returns the answer as a success or failure status. Returns SUCCESS if the user confirms (YES), FAILURE if the user declines (NO). Also writes the boolean result to the 'confirmed' output port so downstream nodes can use it directly. There is no need to speak before this node, as the 'question' input can include the full prompt to be shown or spoken to the user."
    ports:
      - name: "question"
        direction: "Input"
        type: "string"
        description: "Confirmation prompt to show or ask the user (required). Can be a hardcoded literal (e.g. <AskYesNoQuestion question=\"Is that correct?\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "confirmed"
        direction: "Output"
        type: "bool"
        description: "Boolean confirmation result (true for YES, false for NO)."
      - name: "service_name"
        direction: "Input"
        type: "string"
        description: "YesNo service endpoint (optional, default: '/yesno_service')."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Service call timeout in milliseconds (optional, default: 10000)."
    return:
      SUCCESS: "User confirmed (YES). Writes true to the 'confirmed' output port."
      FAILURE: "User declined (NO), or the required 'question' input port is missing/service unavailable. Writes false to the 'confirmed' output port when available."

  - name: "AskOpenQuestion"
    type: "Action"
    description: "Asks the user an open-ended question and captures the answer in one node. Use this when the robot needs a new free-form response from the user."
    ports:
      - name: "question"
        direction: "Input"
        type: "string"
        description: "Question to ask the user (required). Can be a hardcoded literal (e.g. <AskOpenQuestion question=\"What would you like instead?\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "answer"
        direction: "Output"
        type: "string"
        description: "User answer captured by the node."
    return:
      SUCCESS: "Writes the captured user answer to the 'answer' output port."
      FAILURE: "The required 'question' input port is missing."

  - name: "NavigateTo"
    type: "Action"
    description: "Navigates the robot to a named location or to map coordinates."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Destination name (e.g. 'kitchen', 'entrance') or blackboard reference (e.g. '{customer_location}') (required). The blackboard reference must be written by a previous node before this one runs."
      - name: "x"
        direction: "Input"
        type: "double"
        description: "X coordinate in metres (optional, default: 0.0)."
      - name: "y"
        direction: "Input"
        type: "double"
        description: "Y coordinate in metres (optional, default: 0.0)."
    return:
      SUCCESS: "Reaches the destination and signals completion."
      FAILURE: "The required 'target' input port is missing or its blackboard reference is unset."

  - name: "IsDetected"
    type: "Condition"
    description: "Checks whether the TF frame named 'target' is currently detectable from a base frame using TF transforms. Intended to validate that the perception target set by SetPerceptionTarget is currently present before downstream actions."
    ports:
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame to use as reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds (optional, default: 0.5)."
      - name: "detected_frame"
        direction: "Output"
        type: "string"
        description: "Writes the detected frame 'target' to the blackboard for downstream nodes."
    return:
      SUCCESS: "Target frame 'target' is detected and recent; writes 'detected_frame' to the blackboard."
      FAILURE: "The target frame is not detected, stale, or the required base_frame/timeout input cannot be resolved."

  - name: "SetPerceptionTarget"
    type: "Action"
    description: "Configures the perception system to search for a specific target class. The target MUST be a standard YOLO class label (e.g. 'person', 'cup', 'bottle', 'chair') and must not be a custom/free-text entity name. Should be only used once per target class at the start of a behavior sequence, never repeatedly in a loop (do not use within reactive behaviors or sequences within reactive behaviors). This node only sets the target for downstream perception nodes that check for TF frames corresponding to that class."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Target class name to activate in the perception system (required). Must be a standard YOLO class label; do not use custom entity names like customer_1 or waiter_john."
    return:
      SUCCESS: "Configures the perception system for the target class."
      FAILURE: "The required 'target' input port is missing."

  - name: "Extract"
    type: "Action"
    description: "Extracts exactly one semantic information field from a text using an LLM service (e.g. dish, drink, person name). This node is single-field per call: set 'interest' to one target (e.g. 'name' OR 'drink'). If you need multiple fields, chain multiple Extract nodes sequentially, one per field, each writing to its own output variable. This node is intended for semantic field extraction from text, not for map frame resolution."
    ports:
      - name: "interest"
        direction: "Input"
        type: "string"
        description: "Single information field to extract (required). Do not provide a comma-separated list of fields."
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Source text to extract from (required)."
      - name: "extracted_info"
        direction: "Output"
        type: "string"
        description: "The extracted value for the single requested field."
    return:
      SUCCESS: "Writes the extracted information to 'extracted_info'."
      FAILURE: "Required inputs 'interest' or 'text' are missing."

  - name: "FollowDynamic"
    type: "Action"
    description: "Tracks and follows a moving target frame with dynamic speed and distance adjustments; use for target tracking."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to follow (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame (optional, default: base_link)."
      - name: "min_distance"
        direction: "Input"
        type: "float"
        description: "Desired following distance in metres (optional, default: 1.0)."
      - name: "succeed_on_reach"
        direction: "Input"
        type: "bool"
        description: "Return SUCCESS when target is within min_distance (optional, default: false)."
    return:
      SUCCESS: "Follows the target frame with dynamic adjustments."
      FAILURE: "Target frame is unavailable or unreachable."
      RUNNING: "Adjusting speed and distance to follow the target dynamically."

  - name: "Spin"
    type: "Action"
    description: "Publishes in-place rotation commands on every tick and always returns RUNNING. The node does not reach completion by itself; it is halted externally when the search succeeds or times out."
    ports:
      - name: "angular_speed"
        direction: "Input"
        type: "float"
        description: "Angular speed for spinning in rad/s (optional, default: 0.5)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic (optional, default: /cmd_vel)."
      - name: "touch_topic"
        direction: "Input"
        type: "string"
        description: "Touch sensor topic (optional, default: /sensors/touch)."
    return:
      RUNNING: "Publishes angular velocity commands on every tick to keep rotating in place."

  - name: "StopCurrentTask"
    type: "Condition"
    description: "Checks if the robot's current task has to be stopped. This node is intended to be used as a recovery condition that can be triggered by an external event (e.g. user command, safety sensor) to interrupt the robot's ongoing behavior and return control to the main loop for replanning. When this condition returns SUCCESS, the current task should be halted immediately. When it returns FAILURE, the current task continues as normal."
    return:
      SUCCESS: "The robot's current task has to be stopped."
      FAILURE: "The robot's current task does not need to be stopped."

  - name: "IsAvailable"
    type: "Condition"
    description: "Checks whether a list of requested items are available. Returns SUCCESS if all requested items are available and FAILURE if any requested item is unavailable."
    ports:
      - name: "available_items"
        direction: "Input"
        type: "string"
        description: "Semicolon-separated list of available items (e.g. 'pizza;steak;water') (required)."
      - name: "items"
        direction: "Input"
        type: "string"
        description: "Semicolon-separated list of requested item(s) (required)."
      - name: "unavailable_items"
        direction: "Output"
        type: "string"
        description: "Semicolon-separated list of unavailable item(s)."
    return:
      SUCCESS: "All requested items are available."
      FAILURE: "At least one requested item is unavailable."

  - name: "IsTrue"
    type: "Condition"
    description: "Checks whether a boolean input value is true. Returns SUCCESS when the input value is true and FAILURE when it is false."
    ports:
      - name: "value"
        direction: "Input"
        type: "bool"
        description: "Boolean value to evaluate (required)."
    return:
      SUCCESS: "The input boolean is true."
      FAILURE: "The input boolean is false or the required 'value' input port is missing."

  - name: "GetBearing"
    type: "Action"
    description: "Calculates the bearing (angle) to a target TF frame relative to a base frame and writes it to the blackboard."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to calculate bearing to (required)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "bearing"
        direction: "Output"
        type: "double"
        description: "Calculated bearing angle in radians."
    return:
      SUCCESS: "Writes the calculated bearing angle to 'bearing'."
      FAILURE: "Target transform is missing/stale or required input is missing."

  - name: "GetDistance"
    type: "Action"
    description: "Calculates the distance to a target TF frame from a base frame and writes it to the blackboard."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to calculate distance to (required)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "distance"
        direction: "Output"
        type: "double"
        description: "Calculated distance in metres."
    return:
      SUCCESS: "Writes the calculated distance to 'distance'."
      FAILURE: "Target transform is missing/stale or required input is missing."

  - name: "IsAligned"
    type: "Condition"
    description: "Checks if the robot is aligned with a target TF frame within a specified angular threshold."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check if aligned (required)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "angle_threshold"
        direction: "Input"
        type: "double"
        description: "Angular threshold in radians for considering 'aligned' (optional, default: 0.5)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "direction"
        direction: "Output"
        type: "string"
        description: "Bearing direction to align with the target ('left' or 'right')."
    return:
      SUCCESS: "The robot is aligned with the target within the specified angular threshold."
      FAILURE: "The robot is not aligned with the target, transform is stale/missing, or required input is missing."

  - name: "IsFartherThan"
    type: "Condition"
    description: "Checks whether the robot-target distance to a target TF frame is greater than a given distance. Returns SUCCESS if the robot is farther than the specified distance from the target, and FAILURE if it is within range."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check distance to."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "distance_threshold"
        direction: "Input"
        type: "double"
        description: "Distance threshold in metres (optional, default: 1.0). SUCCESS if robot-target distance is > this threshold."
    return:
      SUCCESS: "The robot is farther than the specified distance from the target."
      FAILURE: "The robot is within the specified distance to the target, or the target transform is missing/stale."

  - name: "IsTargetStatic"
    type: "Condition"
    description: "Checks whether a target TF frame has remained static for at least min_static_time_sec by monitoring frame displacement over time."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to evaluate (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "min_static_time_sec"
        direction: "Input"
        type: "double"
        description: "Required stillness duration in seconds before returning SUCCESS (optional, default: 5.0)."
      - name: "position_epsilon"
        direction: "Input"
        type: "double"
        description: "Maximum displacement in metres considered as stillness between consecutive checks (optional, default: 0.05)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
    return:
      SUCCESS: "The target frame remained static for at least min_static_time_sec."
      FAILURE: "The target is still moving, there is insufficient stillness history yet, the transform is stale/missing, or required inputs are invalid."

  - name: "MoveForward"
    type: "Action"
    description: "Publishes a forward velocity command on cmd_vel."
    ports:
      - name: "speed"
        direction: "Input"
        type: "double"
        description: "Forward speed in metres per second (optional, default: 0.5)."
    return:
      SUCCESS: "A forward velocity command has been published."
      FAILURE: "Speed input is invalid."

  - name: "MoveTowards"
    type: "Action"
    description: "Moves the robot towards a target TF frame using PID-based linear and angular velocity control. The robot advances while orienting itself towards the target and keeps the action active, always returning RUNNING."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to move towards (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "goal_distance"
        direction: "Input"
        type: "double"
        description: "Distance in metres at which the robot should stop from the target (optional, default: 1.0)."
      - name: "max_linear_speed"
        direction: "Input"
        type: "double"
        description: "Maximum linear speed in metres per second (optional, default: 0.5)."
      - name: "max_angular_speed"
        direction: "Input"
        type: "double"
        description: "Maximum angular speed in radians per second (optional, default: 1.0)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic where Twist messages are published (optional, default: /cmd_vel)."
      - name: "linear_kp"
        direction: "Input"
        type: "double"
        description: "Proportional gain of the linear PID controller (optional, default: 1.0)."
      - name: "linear_ki"
        direction: "Input"
        type: "double"
        description: "Integral gain of the linear PID controller (optional, default: 0.0)."
      - name: "linear_kd"
        direction: "Input"
        type: "double"
        description: "Derivative gain of the linear PID controller (optional, default: 0.2)."
      - name: "angular_kp"
        direction: "Input"
        type: "double"
        description: "Proportional gain of the angular PID controller (optional, default: 1.0)."
      - name: "angular_ki"
        direction: "Input"
        type: "double"
        description: "Integral gain of the angular PID controller (optional, default: 0.0)."
      - name: "angular_kd"
        direction: "Input"
        type: "double"
        description: "Derivative gain of the angular PID controller (optional, default: 0.3)."
    return:
      RUNNING: "The robot is still approaching, orienting, or holding position near the target frame."
      SUCCESS: "A velocity command toward the target has been published."
      FAILURE: "Look up transformation from frame failed."

  - name: "RotateToBearing"
    type: "Action"
    description: "Publishes an angular velocity command to rotate toward a requested bearing direction."
    ports:
      - name: "bearing"
        direction: "Input"
        type: "string"
        description: "Target bearing direction ('left' or 'right') (required)."
      - name: "angular_speed"
        direction: "Input"
        type: "double"
        description: "Angular speed for rotation in rad/s (optional, default: 0.5)."
    return:
      SUCCESS: "An angular velocity command has been published."
      FAILURE: "Required input is missing, bearing is invalid, or angular_speed is invalid."
    
  - name: "Follow"
    type: "Action"
    description: "Makes the robot follow a person using sensors and PID control with two-phase behavior (rotate then move)."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to follow (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame (optional, default: base_link)."
      - name: "min_distance"
        direction: "Input"
        type: "float"
        description: "Desired distance to target in meters (optional, default: 1.0)."
      - name: "avoidance_distance"
        direction: "Input"
        type: "float"
        description: "Minimum distance to obstacles in meters (optional, default: 0.5)."
      - name: "max_linear_speed"
        direction: "Input"
        type: "float"
        description: "Maximum linear speed in m/s (optional, default: 0.5)."
      - name: "max_angular_speed"
        direction: "Input"
        type: "float"
        description: "Maximum angular speed in rad/s (optional, default: 1.0)."
      - name: "succeed_on_reach"
        direction: "Input"
        type: "bool"
        description: "The node returns SUCCESS when target is reached (optional, default: false)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic (optional, default: /cmd_vel)."
      - name: "sonar_topic"
        direction: "Input"
        type: "string"
        description: "Sonar sensor topic (optional, default: /sensors/sonar)."
      - name: "touch_topic"
        direction: "Input"
        type: "string"
        description: "Touch sensor topic (optional, default: /sensors/touch)."
      - name: "rotation_stop_threshold"
        direction: "Input"
        type: "float"
        description: "Angle threshold to stop rotating in rad (optional, default: 0.087)."
      - name: "linear_stop_threshold"
        direction: "Input"
        type: "float"
        description: "Angle threshold to stop linear motion in rad (optional, default: 0.26)."
    return:
      SUCCESS: "Only if succeed_on_reach input is true and the target is within minimum distance."
      RUNNING: "Actively following the target."
      FAILURE: "The target frame is lost or cannot be found via TF."

  - name: "ForcePlanFail"
    type: "Condition"
    description: "Always returns FAILURE and writes FORCED_FAILURE to bt_last_failure_code. Use this node when the current sub-goal is definitively unachievable under the current plan and the mission must restart from step 0 (e.g. after N failed appointment-validation attempts). The orchestrator will restart plan execution from the beginning, reusing already-generated BTs and without consuming a replan slot."
    ports:
      - name: "fail_message"
        direction: "Input"
        type: "string"
        description: "Human-readable reason for the forced plan restart (required)."
    return:
      FAILURE: "Always. Writes FORCED_FAILURE to bt_last_failure_code and the message (if provided) to bt_last_failure."

