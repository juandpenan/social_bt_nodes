bt_nodes:
  - name: "Speak"
    type: "Action"
    description: "Synthesizes and speaks the specified text using a TTS service."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Text to be spoken."
      - name: "service_name"
        direction: "Input"
        type: "string"
        description: "Name of the TTS service (optional, default: /tts_service)."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Maximum wait time in ms (optional, default: 5000)."
    return:
      SUCCESS: "The speech has been completed (service responds and estimated speech duration elapses)."
      RUNNING: "Waiting for the service response or during speech playback."
      FAILURE: "The service is unavailable, the text parameter is missing, or the service call fails."

  - name: "Listen"
    type: "Action"
    description: "Listens and transcribes speech to text using an STT service."
    ports:
      - name: "service_name"
        direction: "Input"
        type: "string"
        description: "Name of the STT service (optional, default: /stt_service)."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Maximum wait time in ms (optional, default: 10000)."
      - name: "transcribed_text"
        direction: "Output"
        type: "string"
        description: "Transcribed text."
    return:
      SUCCESS: "Speech is successfully transcribed and the text is available in the output port."
      RUNNING: "The service is processing the audio."
      FAILURE: "The service is unavailable or transcription fails."

  - name: "Confirmation"
    type: "Action"
    description: "Analyzes input text for yes/no responses. Returns SUCCESS only if user confirms (YES), FAILURE otherwise."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Text to analyze for yes/no response."
      - name: "service_name"
        direction: "Input"
        type: "string"
        description: "Service name (optional, default: /yesno_service)."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Maximum wait time in ms (optional, default: 10000)."
    return:
      SUCCESS: "User confirmed (result is 'YES')."
      RUNNING: "Waiting for the service response."
      FAILURE: "User did not confirm (result is 'NO'), service unavailable, or timeout."

  - name: "NaoSetLeds"
    type: "Action"
    description: "Controls the NAO robot LEDs via action server."
    ports:
      - name: "led_ids"
        direction: "Input"
        type: "string"
        description: "IDs of LEDs to control (e.g., '0,1')."
      - name: "mode"
        direction: "Input"
        type: "int"
        description: "LED mode (0: STEADY, 1: BLINK, etc)."
      - name: "color_r"
        direction: "Input"
        type: "float"
        description: "Red color component (0.0-1.0)."
      - name: "color_g"
        direction: "Input"
        type: "float"
        description: "Green color component (0.0-1.0)."
      - name: "color_b"
        direction: "Input"
        type: "float"
        description: "Blue color component (0.0-1.0)."
      - name: "intensity"
        direction: "Input"
        type: "float"
        description: "LED intensity."
      - name: "frequency"
        direction: "Input"
        type: "float"
        description: "Blink frequency."
      - name: "duration"
        direction: "Input"
        type: "float"
        description: "Duration in seconds."
      - name: "action_server"
        direction: "Input"
        type: "string"
        description: "Action server name (optional, default: leds_play)."
      - name: "timeout"
        direction: "Input"
        type: "float"
        description: "Timeout in seconds."
      - name: "success"
        direction: "Output"
        type: "bool"
        description: "Indicates if the action was successful."
    return:
      SUCCESS: "The LED action completes successfully (goal accepted and succeeded)."
      RUNNING: "The action is being executed or waiting for goal acceptance."
      FAILURE: "The action server is unavailable, the goal is rejected, the action times out, is aborted, or if required LED IDs are missing or invalid."

  - name: "NaoPosition"
    type: "Action"
    description: "Executes a predefined movement action on the NAO robot."
    ports:
      - name: "action_name"
        direction: "Input"
        type: "string"
        description: "Name of the action to execute."
      - name: "action_server"
        direction: "Input"
        type: "string"
        description: "Action server name (optional, default: /nao_pos_server)."
      - name: "timeout"
        direction: "Input"
        type: "float"
        description: "Maximum wait time in seconds."
      - name: "success"
        direction: "Output"
        type: "bool"
        description: "Indicates if the action was successful."
    return:
      SUCCESS: "The movement action completes successfully."
      RUNNING: "The action is being executed or waiting for goal acceptance."
      FAILURE: "The action server is unavailable, the required action_name parameter is missing, the goal is rejected, the action times out, or is aborted."

  - name: "SetRos2Param"
    type: "Action"
    description: "Sets a parameter on a ROS 2 node."
    ports:
      - name: "node_name"
        direction: "Input"
        type: "string"
        description: "Name of the ROS 2 node."
      - name: "param_name"
        direction: "Input"
        type: "string"
        description: "Parameter name."
      - name: "param_value"
        direction: "Input"
        type: "string"
        description: "Parameter value."
      - name: "param_type"
        direction: "Input"
        type: "string"
        description: "Parameter type (string, int, double, bool)."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Maximum wait time in ms."
      - name: "success"
        direction: "Output"
        type: "bool"
        description: "Indicates if the action was successful."
    return:
      SUCCESS: "The parameter is successfully set on the target node."
      RUNNING: "Waiting for the service response."
      FAILURE: "Any required parameter (node_name, param_name, param_value) is missing, the parameter service is unavailable, or the parameter setting fails."

  - name: "IsTargetDetected"
    type: "Condition"
    description: "Checks if a target is detected using TF transforms."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target frame to search for."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base reference frame."
      - name: "timeout"
        direction: "Input"
        type: "float"
        description: "Maximum wait time in seconds."
    return:
      SUCCESS: "The target frame is found and the transform is recent (not stale)."
      FAILURE: "Required inputs (target_frame, base_frame) are missing, the transform cannot be found, or the transform is older than the timeout threshold."

  - name: "SetPerceptionTarget"
    type: "Action"
    description: "Sets the object class to be perceived by the perception system. A TF called 'perception_target' will be published when the target is detected by the perception system."
    ports:
      - name: "service_name"
        direction: "Input"
        type: "string"
        description: "Service name (optional, default: /set_perception_target)."
      - name: "target_class"
        direction: "Input"
        type: "string"
        description: "Target class to detect."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Maximum wait time in ms."
      - name: "success"
        direction: "Output"
        type: "bool"
        description: "Indicates if the action was successful."
      - name: "message"
        direction: "Output"
        type: "string"
        description: "Status message."
    return:
      SUCCESS: "The target class is successfully configured."
      RUNNING: "Waiting for the service response."
      FAILURE: "The required target_class parameter is missing, the service is unavailable, or the service call fails."

  - name: "SpeakEnum"
    type: "Action"
    description: "Enumerates and speaks a list of items using TTS with proper conjunction."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Text with items separated by separator."
      - name: "separator"
        direction: "Input"
        type: "string"
        description: "Item separator (default: ',')."
      - name: "language"
        direction: "Input"
        type: "string"
        description: "Language for final conjunction ('es' for Spanish, 'en' for English)."
      - name: "service_name"
        direction: "Input"
        type: "string"
        description: "TTS service name."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Maximum wait time in ms."
    return:
      SUCCESS: "All items have been spoken (service responds and estimated speech duration elapses)."
      RUNNING: "Waiting for the service response or during speech playback."
      FAILURE: "The required text parameter is missing, no items are found in the text, or the TTS service is unavailable."

  - name: "Extract"
    type: "Action"
    description: "Extracts information of interest from a text using an LLM service."
    ports:
      - name: "interest"
        direction: "Input"
        type: "string"
        description: "Information of interest to extract (only one value)."
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Source text."
      - name: "service_name"
        direction: "Input"
        type: "string"
        description: "Service name (optional, default: /extract_service)."
      - name: "timeout"
        direction: "Input"
        type: "int"
        description: "Maximum wait time in ms."
      - name: "extracted_info"
        direction: "Output"
        type: "string"
        description: "The extracted information."
    return:
      SUCCESS: "The information is successfully extracted and available in the output."
      RUNNING: "The service is processing the request."
      FAILURE: "Required parameters (interest, text) are missing or the extraction service is unavailable."

  - name: "Follow"
    type: "Action"
    description: "Makes the robot follow a person using sensors and PID control with two-phase behavior (rotate then move)."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to follow (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame (optional, default: base_link)."
      - name: "min_distance"
        direction: "Input"
        type: "float"
        description: "Desired distance to target in meters (optional, default: 1.0)."
      - name: "avoidance_distance"
        direction: "Input"
        type: "float"
        description: "Minimum distance to obstacles in meters (optional, default: 0.5)."
      - name: "max_linear_speed"
        direction: "Input"
        type: "float"
        description: "Maximum linear speed in m/s (optional, default: 0.5)."
      - name: "max_angular_speed"
        direction: "Input"
        type: "float"
        description: "Maximum angular speed in rad/s (optional, default: 1.0)."
      - name: "succeed_on_reach"
        direction: "Input"
        type: "bool"
        description: "Return SUCCESS when target is reached (optional, default: false)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic (optional, default: /cmd_vel)."
      - name: "sonar_topic"
        direction: "Input"
        type: "string"
        description: "Sonar sensor topic (optional, default: /sensors/sonar)."
      - name: "touch_topic"
        direction: "Input"
        type: "string"
        description: "Touch sensor topic (optional, default: /sensors/touch)."
      - name: "rotation_stop_threshold"
        direction: "Input"
        type: "float"
        description: "Angle threshold to stop rotating in rad (optional, default: 0.087)."
      - name: "linear_stop_threshold"
        direction: "Input"
        type: "float"
        description: "Angle threshold to stop linear motion in rad (optional, default: 0.26)."
    return:
      SUCCESS: "Only if succeed_on_reach input is true and the target is within minimum distance."
      RUNNING: "Actively following the target or when stopped by touch sensor or obstacles."
      FAILURE: "The target frame is lost or cannot be found via TF."

  - name: "FollowDynamic"
    type: "Action"
    description: "Follows a person with dynamic speed and distance adjustments using PID control for both linear and angular velocities."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to follow (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame (optional, default: base_link)."
      - name: "min_distance"
        direction: "Input"
        type: "float"
        description: "Desired distance to target in meters (optional, default: 1.0)."
      - name: "avoidance_distance"
        direction: "Input"
        type: "float"
        description: "Minimum distance to obstacles in meters (optional, default: 0.5)."
      - name: "danger_distance"
        direction: "Input"
        type: "float"
        description: "Critical distance - robot stops if obstacle closer in meters (optional, default: 0.3)."
      - name: "max_linear_speed"
        direction: "Input"
        type: "float"
        description: "Maximum linear speed in m/s (optional, default: 0.5)."
      - name: "max_angular_speed"
        direction: "Input"
        type: "float"
        description: "Maximum angular speed in rad/s (optional, default: 1.0)."
      - name: "succeed_on_reach"
        direction: "Input"
        type: "bool"
        description: "Return SUCCESS when target is reached (optional, default: false)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic (optional, default: /cmd_vel)."
      - name: "sonar_topic"
        direction: "Input"
        type: "string"
        description: "Sonar sensor topic (optional, default: /sensors/sonar)."
      - name: "touch_topic"
        direction: "Input"
        type: "string"
        description: "Touch sensor topic (optional, default: /sensors/touch)."
      - name: "linear_vel_strategy"
        direction: "Input"
        type: "string"
        description: "Linear velocity strategy: 'proportional' or 'pid' (optional, default: proportional)."
    return:
      SUCCESS: "Only if succeed_on_reach input is true and the target is within minimum distance."
      RUNNING: "Actively following the target or when stopped by touch sensor or obstacles."
      FAILURE: "The target frame is lost or cannot be found via TF."

  - name: "SpinSearch"
    type: "Action"
    description: "Makes the robot spin in place to search for targets."
    ports:
      - name: "angular_speed"
        direction: "Input"
        type: "float"
        description: "Angular speed for spinning in rad/s (optional, default: 0.5)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic (optional, default: /cmd_vel)."
      - name: "touch_topic"
        direction: "Input"
        type: "string"
        description: "Touch sensor topic (optional, default: /sensors/touch)."
    return:
      RUNNING: "Continuously spinning (designed to run indefinitely until halted by the behavior tree, typically when a target is detected). Stops rotation when touch sensor is pressed but continues returning RUNNING."

  - name: "NavigateTo"
    type: "Action"
    description: "Navigates to a target position using a Nav2 action server."
    ports:
      - name: "x"
        direction: "Input"
        type: "float"
        description: "X coordinate in meters (map frame)."
      - name: "y"
        direction: "Input"
        type: "float"
        description: "Y coordinate in meters (map frame)."
      - name: "yaw"
        direction: "Input"
        type: "float"
        description: "Yaw orientation in radians (optional, default: 0.0)."
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to navigate to (alternative to x,y,yaw)."
      - name: "frame_id"
        direction: "Input"
        type: "string"
        description: "Frame ID for the goal pose (optional, default: map)."
      - name: "action_name"
        direction: "Input"
        type: "string"
        description: "Navigation action name (optional, default: navigate_to_pose)."
      - name: "timeout"
        direction: "Input"
        type: "float"
        description: "Maximum wait time in seconds (optional, default: 300.0)."
      - name: "error_msg"
        direction: "Output"
        type: "string"
        description: "Error message if navigation fails."
    return:
      SUCCESS: "The robot successfully reaches the goal position."
      RUNNING: "Navigation is in progress or waiting for goal acceptance."
      FAILURE: "The action server is unavailable, required parameters (x, y or target_frame) are missing, the goal is rejected, the navigation times out, is aborted, or if TF lookup fails when using frame-based navigation."
