bt_nodes:
  - name: "Speak"
    type: "Action"
    description: "Speaks the provided text using TTS."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Text to be spoken (required). Can be a hardcoded literal (e.g. <Speak text=\"Hello!\"/>) or a blackboard reference written by a previous node (e.g. <Speak text=\"{extracted_info}\"/>). The value must be set at runtime — never use a blackboard reference that has not been written yet."
    return:
      SUCCESS: "Speaks the text provided."
      FAILURE: "The required 'text' input port is missing."

  - name: "YesNo"
    type: "Action"
    description: "Asks the user a yes/no question, captures the reply, and returns the confirmation result in one node. Use this as a complete ask-for-confirmation interaction; do not add an extra Listen node for the same yes/no exchange unless the interaction is intentionally split across steps."
    ports:
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Confirmation prompt to show or ask the user (required). Can be a hardcoded literal (e.g. <YesNo text=\"Is that correct?\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "confirmed"
        direction: "Output"
        type: "string"
        description: "User confirmation result ('true' or 'false')."
    return:
      SUCCESS: "Writes the confirmation result ('true' or 'false') to the 'confirmed' output port."
      FAILURE: "The required 'text' input port is missing."

  - name: "Ask"
    type: "Action"
    description: "Asks the user an open-ended question and captures the answer in one node. Use this when the robot needs a new free-form response from the user."
    ports:
      - name: "question"
        direction: "Input"
        type: "string"
        description: "Question to ask the user (required). Can be a hardcoded literal (e.g. <Ask question=\"What would you like instead?\"/>) or a blackboard reference written by a previous node. The value must be set at runtime — never use a blackboard reference that has not been written yet."
      - name: "answer"
        direction: "Output"
        type: "string"
        description: "User answer captured by the node."
    return:
      SUCCESS: "Writes the captured user answer to the 'answer' output port."
      FAILURE: "The required 'question' input port is missing."

  - name: "NavigateTo"
    type: "Action"
    description: "Navigates the robot to a named location or to map coordinates."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Destination name (e.g. 'kitchen', 'entrance') or blackboard reference (e.g. '{customer_location}') (required). The blackboard reference must be written by a previous node before this one runs."
      - name: "x"
        direction: "Input"
        type: "double"
        description: "X coordinate in metres (optional, default: 0.0)."
      - name: "y"
        direction: "Input"
        type: "double"
        description: "Y coordinate in metres (optional, default: 0.0)."
    return:
      SUCCESS: "Reaches the destination and signals completion."
      FAILURE: "The required 'target' input port is missing or its blackboard reference is unset."

  - name: "IsDetected"
    type: "Condition"
    description: "Checks whether a target TF frame is currently detectable from a base frame using TF transforms. Intended to validate that the perception target (previously set) is currently present before downstream actions."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame to use as reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds (optional, default: 0.5)."
      - name: "detected_frame"
        direction: "Output"
        type: "string"
        description: "Writes the detected frame (same as target_frame) to the blackboard for downstream nodes."
    return:
      SUCCESS: "Target frame is detected and recent; writes 'detected_frame' to the blackboard."
      FAILURE: "Target frame is not detected, stale, or a required input port cannot be resolved."

  - name: "SetPerceptionTarget"
    type: "Action"
    description: "Configures the perception system to search for a specific target class. The target MUST be a standard YOLO class label (e.g. 'person', 'cup', 'bottle', 'chair') and must not be a custom/free-text entity name. Should be only used once per target class at the start of a behavior sequence, never repeatedly in a loop (do not use within reactive behaviors or sequences within reactive behaviors). This node only sets the target for downstream perception nodes that check for TF frames corresponding to that class."
    ports:
      - name: "target"
        direction: "Input"
        type: "string"
        description: "Target class name to activate in the perception system (required). Must be a standard YOLO class label; do not use custom entity names like customer_1 or waiter_john."
    return:
      SUCCESS: "Configures the perception system for the target class."
      FAILURE: "The required 'target' input port is missing."

  - name: "Extract"
    type: "Action"
    description: "Extracts exactly one semantic information field from a text using an LLM service (e.g. dish, drink, person name). This node is single-field per call: set 'interest' to one target (e.g. 'name' OR 'drink'). If you need multiple fields, chain multiple Extract nodes sequentially, one per field, each writing to its own output variable. This node is intended for semantic field extraction from text, not for map frame resolution."
    ports:
      - name: "interest"
        direction: "Input"
        type: "string"
        description: "Single information field to extract (required). Do not provide a comma-separated list of fields."
      - name: "text"
        direction: "Input"
        type: "string"
        description: "Source text to extract from (required)."
      - name: "extracted_info"
        direction: "Output"
        type: "string"
        description: "The extracted value for the single requested field."
    return:
      SUCCESS: "Writes the extracted information to 'extracted_info'."
      FAILURE: "Required inputs 'interest' or 'text' are missing."

  - name: "FollowDynamic"
    type: "Action"
    description: "Tracks and follows a moving target frame with dynamic speed and distance adjustments; use for target tracking."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to follow (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame (optional, default: base_link)."
      - name: "min_distance"
        direction: "Input"
        type: "float"
        description: "Desired following distance in metres (optional, default: 1.0)."
      - name: "succeed_on_reach"
        direction: "Input"
        type: "bool"
        description: "Return SUCCESS when target is within min_distance (optional, default: false)."
    return:
      SUCCESS: "Follows the target frame with dynamic adjustments."
      FAILURE: "Target frame is unavailable or unreachable."
      RUNNING: "Adjusting speed and distance to follow the target dynamically."

  - name: "Spin"
    type: "Action"
    description: "Publishes in-place rotation commands on every tick and always returns RUNNING. The node does not reach completion by itself; it is halted externally when the search succeeds or times out."
    ports:
      - name: "angular_speed"
        direction: "Input"
        type: "float"
        description: "Angular speed for spinning in rad/s (optional, default: 0.5)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic (optional, default: /cmd_vel)."
      - name: "touch_topic"
        direction: "Input"
        type: "string"
        description: "Touch sensor topic (optional, default: /sensors/touch)."
    return:
      RUNNING: "Publishes angular velocity commands on every tick to keep rotating in place."

  - name: "StopCurrentTask"
    type: "Condition"
    description: "Checks if the robot's current task has to be stopped. This node is intended to be used as a recovery condition that can be triggered by an external event (e.g. user command, safety sensor) to interrupt the robot's ongoing behavior and return control to the main loop for replanning. When this condition returns SUCCESS, the current task should be halted immediately. When it returns FAILURE, the current task continues as normal."
    return:
      SUCCESS: "The robot's current task has to be stopped."
      FAILURE: "The robot's current task does not need to be stopped."

  - name: "IsAvailable"
    type: "Condition"
    description: "Checks whether a list of requested items are available. Returns SUCCESS if all requested items are available and FAILURE if any requested item is unavailable."
    ports:
      - name: "available_items"
        direction: "Input"
        type: "string"
        description: "Semicolon-separated list of available items (e.g. 'pizza;steak;water') (required)."
      - name: "items"
        direction: "Input"
        type: "string"
        description: "Semicolon-separated list of requested item(s) (required)."
      - name: "unavailable_items"
        direction: "Output"
        type: "string"
        description: "Semicolon-separated list of unavailable item(s)."
    return:
      SUCCESS: "All requested items are available."
      FAILURE: "At least one requested item is unavailable."

  - name: "GetBearing"
    type: "Action"
    description: "Calculates the bearing (angle) to a target TF frame relative to a base frame and writes it to the blackboard."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to calculate bearing to (required)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "bearing"
        direction: "Output"
        type: "double"
        description: "Calculated bearing angle in radians."
    return:
      SUCCESS: "Writes the calculated bearing angle to 'bearing'."
      FAILURE: "Target transform is missing/stale or required input is missing."

  - name: "GetDistance"
    type: "Action"
    description: "Calculates the distance to a target TF frame from a base frame and writes it to the blackboard."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to calculate distance to (required)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "distance"
        direction: "Output"
        type: "double"
        description: "Calculated distance in metres."
    return:
      SUCCESS: "Writes the calculated distance to 'distance'."
      FAILURE: "Target transform is missing/stale or required input is missing."

  - name: "IsAligned"
    type: "Condition"
    description: "Checks if the robot is aligned with a target TF frame within a specified angular threshold."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check if aligned (required)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "angle_threshold"
        direction: "Input"
        type: "double"
        description: "Angular threshold in radians for considering 'aligned' (optional, default: 0.5)."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
      - name: "direction"
        direction: "Output"
        type: "string"
        description: "Bearing direction to align with the target ('left' or 'right')."
    return:
      SUCCESS: "The robot is aligned with the target within the specified angular threshold."
      FAILURE: "The robot is not aligned with the target, transform is stale/missing, or required input is missing."

  - name: "IsInRange"
    type: "Condition"
    description: "Checks whether the robot-target distance is less than or equal to a distance threshold for a target TF frame."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to check distance to (required)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "distance_threshold"
        direction: "Input"
        type: "double"
        description: "Maximum allowed distance in metres (optional, default: 1.0). SUCCESS if robot-target distance is <= this threshold."
      - name: "timeout"
        direction: "Input"
        type: "double"
        description: "Maximum wait/staleness threshold in seconds for the target transform (optional, default: 0.5)."
    return:
      SUCCESS: "The robot is at distance_threshold metres or less from the target."
      FAILURE: "The robot is farther than distance_threshold from the target, transform is stale/missing, or required input is missing."

  - name: "MoveForward"
    type: "Action"
    description: "Publishes a forward velocity command on cmd_vel."
    ports:
      - name: "speed"
        direction: "Input"
        type: "double"
        description: "Forward speed in metres per second (optional, default: 0.5)."
    return:
      SUCCESS: "A forward velocity command has been published."
      FAILURE: "Speed input is invalid."

  - name: "MoveTowards"
    type: "Action"
    description: "Moves the robot towards a target TF frame using PID-based linear and angular velocity control. The robot advances while orienting itself towards the target and returns SUCCESS once it reaches the requested goal distance."
    ports:
      - name: "target_frame"
        direction: "Input"
        type: "string"
        description: "Target TF frame to move towards (optional, default: target)."
      - name: "base_frame"
        direction: "Input"
        type: "string"
        description: "Base TF frame for reference (optional, default: base_link)."
      - name: "goal_distance"
        direction: "Input"
        type: "double"
        description: "Distance in metres at which the robot should stop from the target (optional, default: 1.0)."
      - name: "max_linear_speed"
        direction: "Input"
        type: "double"
        description: "Maximum linear speed in metres per second (optional, default: 0.5)."
      - name: "max_angular_speed"
        direction: "Input"
        type: "double"
        description: "Maximum angular speed in radians per second (optional, default: 1.0)."
      - name: "cmd_vel_topic"
        direction: "Input"
        type: "string"
        description: "Velocity command topic where Twist messages are published (optional, default: /cmd_vel)."
      - name: "linear_kp"
        direction: "Input"
        type: "double"
        description: "Proportional gain of the linear PID controller (optional, default: 1.0)."
      - name: "linear_ki"
        direction: "Input"
        type: "double"
        description: "Integral gain of the linear PID controller (optional, default: 0.0)."
      - name: "linear_kd"
        direction: "Input"
        type: "double"
        description: "Derivative gain of the linear PID controller (optional, default: 0.2)."
      - name: "angular_kp"
        direction: "Input"
        type: "double"
        description: "Proportional gain of the angular PID controller (optional, default: 1.0)."
      - name: "angular_ki"
        direction: "Input"
        type: "double"
        description: "Integral gain of the angular PID controller (optional, default: 0.0)."
      - name: "angular_kd"
        direction: "Input"
        type: "double"
        description: "Derivative gain of the angular PID controller (optional, default: 0.3)."
    return:
      SUCCESS: "The robot reaches the requested goal distance from the target frame and stops."
      FAILURE: "The target transform cannot be obtained or a required input is invalid."
      RUNNING: "The robot is still approaching or orienting towards the target frame."

  - name: "RotateToBearing"
    type: "Action"
    description: "Publishes an angular velocity command to rotate toward a requested bearing direction."
    ports:
      - name: "bearing"
        direction: "Input"
        type: "string"
        description: "Target bearing direction ('left' or 'right') (required)."
      - name: "angular_speed"
        direction: "Input"
        type: "double"
        description: "Angular speed for rotation in rad/s (optional, default: 0.5)."
    return:
      SUCCESS: "An angular velocity command has been published."
      FAILURE: "Required input is missing, bearing is invalid, or angular_speed is invalid."
